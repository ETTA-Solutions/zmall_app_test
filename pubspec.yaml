name: zmall
description: ZMall E-commerce App

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 3.2.10+365

environment:
  sdk: ">=3.10.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──
  provider: ^6.1.5+1

  # ── UI: icons ──
  cupertino_icons: ^1.0.9
  heroicons_flutter: ^0.5.0       # 0.5.0 fixed the final-IconData build issue
  iconsx_plus: ^1.0.1             # FontAwesome icons (replaces broken font_awesome_flutter)

  # ── UI: widgets, layout & effects ──
  shimmer: ^3.0.0                 # skeleton loading effect
  flutter_spinkit: ^5.2.2         # loading spinners
  modal_progress_hud_nsn: ^0.5.1  # progress overlay
  overlay_support: ^2.1.0         # in-app notifications / overlays
  smooth_star_rating_null_safety: ^1.0.4+2
  percent_indicator: ^4.2.5
  flutter_staggered_grid_view: ^0.7.0
  photo_view: ^0.15.0             # zoomable image viewer
  page_flip: ^0.2.5+1             # magazine page-flip
  visibility_detector: ^0.4.0+2
  confetti: ^0.8.0
  country_code_picker: ^3.4.1
  google_fonts: ^6.2.1            # custom fonts (used by subscription screen)
  # flutter_animate:              # (disabled)

  # ── Networking ──
  http: ^1.6.0
  dio: ^5.9.2

  # ── Images & media ──
  cached_network_image: ^3.4.1
  image_picker: ^1.2.2
  just_audio: ^0.10.5             # yearly recap audio

  # ── Maps & location ──
  geolocator: ^14.0.3
  fl_location: ^5.0.0
  flutter_map: ^8.3.0
  google_maps_flutter: ^2.17.1

  # ── Firebase ──
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  firebase_analytics: ^12.4.1
  firebase_messaging: ^16.3.0
  firebase_in_app_messaging: ^0.9.2+3

  # ── Analytics ──
  facebook_app_events: ^0.30.0

  # ── Storage & persistence ──
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

  # ── Security & auth ──
  encrypt: ^5.0.3
  flutter_secure_storage: ^11.0.0
  local_auth: ^3.0.1              # biometric auth
  sms_autofill: ^2.5.0            # OTP autofill

  # ── Web & deep links ──
  url_launcher: ^6.3.2
  flutter_inappwebview: ^6.1.5
  app_links: ^7.1.2

  # ── Documents ──
  pdfx: ^2.9.2                    # magazine PDF reader

  # ── Localization & formatting ──
  intl: ^0.20.2
  timezone: ^0.11.0

  # ── Utilities ──
  uuid: ^4.5.3
  package_info_plus: ^10.1.0
  share_plus: ^13.1.0             # yearly recap sharing
  screenshot: ^3.0.0              # yearly recap screenshot
  rate_my_app: ^2.4.0
  app_version_update: ^7.0.0      # check for app updates

  # Vendored + patched locally: 0.4.0 subclasses the now-final IconData and
  # won't compile on current Flutter. Swap back to a pub version once a fixed
  # release ships, then delete packages/heroicons_flutter.
  # heroicons_flutter:
    # path: packages/heroicons_flutter


module:
  androidX: true

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: Nunito
      fonts:
        - asset: fonts/Nunito-Regular.ttf
  uses-material-design: true

  assets:
    - images/
    - assets/
    - images/payment/
    - images/pl_logos/
    - images/pl_logos/nation/ # Added: national team logos for World Cup (e.g. GER.png, BRA.png)
    - images/store_tags/
    - images/meal/
    - assets/audio/
#    - packages/timezone/data/2021a.tzf

# An image asset can refer to one or more resolution-specific "variants", see
# https://flutter.dev/assets-and-images/#resolution-aware.

# For details regarding adding assets from package dependencies, see
# https://flutter.dev/assets-and-images/#from-packages

# To add custom fonts to your application, add a fonts section here,
# in this "flutter" section. Each entry in this list should have a
# "family" key with the font family name, and a "fonts" key with a
# list giving the asset and other descriptors for the font. For
# example:
# fonts:
#   - family: Schyler
#     fonts:
#       - asset: fonts/Schyler-Regular.ttf
#       - asset: fonts/Schyler-Italic.ttf
#         style: italic
#   - family: Trajan Pro
#     fonts:
#       - asset: fonts/TrajanPro.ttf
#       - asset: fonts/TrajanPro_Bold.ttf
#         weight: 700
#
# For details regarding fonts from package dependencies,
# see https://flutter.dev/custom-fonts/#from-packages
