org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# org.gradle.jvmargs=-Xmx1536M
android.useAndroidX=true
android.enableJetifier=true
org.gradle.parallel=true
org.gradle.caching=true
# Enable 16KB page size support for Android 15+
# android.experimental.enable16KbPageSizes=true
# 
# Force Java 17 for all modules
# org.gradle.java.home=/opt/homebrew/Cellar/openjdk@17/17.0.14/libexec/openjdk.jdk/Contents/Home
# 
# Use Flutter's built-in Kotlin instead of applying the Kotlin Gradle Plugin (KGP)
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Disable Kotlin incremental compilation: the Pub cache (C:) and project (D:) are on
# different drives, which crashes Kotlin's incremental cache (RelocatableFileToPathConverter).
kotlin.incremental=false